<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FellaRide — Community Ignition Engine</title>
  <meta name="description" content="Discover mobility demand, identify key activators, and ignite carpool communities from zero." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <!-- Loading -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-inner">
      <div class="loading-brand">
        <div class="loading-brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/>
            <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
          </svg>
        </div>
        <span class="loading-brand-name">FellaRide</span>
      </div>
      <div class="loading-bar"><div class="loading-bar-fill"></div></div>
      <p class="loading-status">Initialising engine…</p>
    </div>
  </div>

  <!-- App -->
  <div id="app" style="display:none;"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
